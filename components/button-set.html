<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>

<style>
    body {
        background-color: #f4f6f9;
        font-family: Arial, sans-serif;
    }

    h2 {
        color: navy;
        font-size: 20px;
    }

    .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
    }

    .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
    }

    .btn-primary {
        background-color: #2563eb;
        color: white;
    }

    .btn-secondary {
        background-color: rgb(220, 220, 220);
    }

    .btn-outline {
        background-color: white;
        border: 2px solid #333333;
    }

    .btn-send {
        background-color: rgba(34, 139, 34, 0.9);
        color: white;
    }

    .btn-secondary, .btn-outline {
        color: #222222;
    }

    .btn-primary:hover {
        background-color: darkblue;
    }

    .btn-secondary:hover {
        background-color: gray;
    }

    .btn-outline:hover {
        background-color: lightblue;
    }

    .btn-send:hover {
        background-color: darkgreen;
    }
</style>

</head>

<body>

<main>
    <h2>Kumpulan Tombol</h2>

    <div class="button-group">

        <a href="#" class="btn btn-primary">Lihat Proyek</a>

        <a href="#" class="btn btn-secondary">Unduh CV</a>

        <a href="#" class="btn btn-outline">Hubungi Saya</a>

        <a href="#" class="btn btn-send">Kirim Pesan</a>

    </div>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</main>

</body>
</html>
