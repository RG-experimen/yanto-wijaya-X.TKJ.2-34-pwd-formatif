<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: #f4f6f9;
        font-family: Arial, sans-serif;
        color: #333333;
    }

    .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #cccccc;
        margin: 30px auto;
    }

    .card img {
        width: 100%;
        height: 160px;
        display: block;
    }

    .card h3 {
        color: #263d63;
        margin-bottom: 8px;
    }

    .card p,
    .card a {
        font-size: 15px;
    }

    .card a {
        color: #2563a6;
    }

    footer {
        text-align: center;
    }
</style>

</head>
<body>

<main>
    <div class="card">
        <img src="../assets/images/project.jpg" alt="Proyek Website Portofolio">

        <h3>Website Portofolio</h3>

        <p>
            Saya membuat website portofolio menggunakan HTML dan CSS.
            Website ini digunakan untuk menampilkan profil dan hasil karya saya.
        </p>

        <a href="#">Lihat Proyek</a>
    </div>
</main>

<footer>
    <a href="../index.html">Back To Home</a>
</footer>

</body>
</html>
