<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
<style>
    body {
        margin: 0;
        background-color: #f4f6f9;
        font-family: Arial, sans-serif;
        color: #333333;
    }

    #contact {
        padding: 40px 20px;
    }

    .contact-form {
        width: 400px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #cccccc;
        background-color: #ffffff;
    }

    .contact-form h2 {
        text-align: center;
        color: #263d63;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 5px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        background-color: #f0f5ff;
        border-color: #263d63;
        outline: none;
    }

    .btn-submit {
        padding: 10px 18px;
        background-color: #263d63;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn-submit:hover {
        background-color: #e58b36;
    }
</style>
</head>
<body>
    <section id="contact">
    <form class="contact-form">
        <h2>Hubungi Saya</h2>

        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="5"></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
</section>
</body>
</html>
